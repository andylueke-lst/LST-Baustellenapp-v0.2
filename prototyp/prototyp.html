function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function labels(z){return {1:z.start==='hotel'?null:'Ankunft Büro',2:z.start==='hotel'?'Abfahrt Hotel':'Abfahrt zur Baustelle',3:'Ankunft Baustelle',4:'Abfahrt von Baustelle',5:z.ende==='hotel'?'Ankunft Hotel':'Ankunft Büro',6:z.ende==='hotel'?null:'Feierabend'}}

function calc(z){const A=adj(z);const p=k=>A[k]??null;const L=labels(z);

  const fahrt=(p(2)!=null&&p(3)!=null?p(3)-p(2):0)+(p(4)!=null&&p(5)!=null?p(5)-p(4):0);
  const ort=p(3)!=null&&p(4)!=null?p(4)-p(3):null;
  const first=L[1]?p(1):p(2), last=L[6]?p(6):p(5);
  const brutto=first!=null&&last!=null?last-first:null;
  const known=Object.values(A);const est=brutto??(first!=null&&known.length?Math.max(...known)-first:null);
  const pz=pOk(z)?z.pause:minPause(est);

function adj(z){const L=labels(z);const r={};let off=0,prev=null;const n=nightOk(z);for(const k of [1,2,3,4,5,6]){if(!L[k]||!z.p[k])continue;let m=toMin(z.p[k])+off;if(prev!=null&&m<prev&&n&&off===0){off=1440;m+=1440}r[k]=m;prev=m}return r}

function _unusedOrderErr(z,k,t){const L=labels(z);const ks=[1,2,3,4,5,6].filter(x=>L[x]&&x!==+k&&z.p[x]);const m=toMin(t);
  const before=ks.filter(x=>x<+k).pop(),after=ks.find(x=>x>+k);
  if(before&&toMin(z.p[before])>m)return `${L[k]} (${t}) kann nicht vor ${L[before]} (${z.p[before]}) liegen.`;
  if(after&&toMin(z.p[after])<m)return `${L[k]} (${t}) kann nicht nach ${L[after]} (${z.p[after]}) liegen.`;return''}

function tHeute(e){const open=offenerTag(e);const tag=selTag(e);

  else if(!open)top=`<div class="callout" style="margin-bottom:16px"><span>🌅</span><div>Tag ${e.tage.length} ist erledigt. Unten geht es mit „Neuer Tag“ weiter oder mit „Job abschließen“ zum Lieferschein.</div></div>`;
  if(!tag)return top+reiseList(e);
  const lk=locked(e,tag);const keys=Object.keys(tag.zeiten);const team=keys.length?keys:[e.team.vor,e.team.fach].filter(Boolean);
  return top+reiseList(e)+dayTabs(e)+`<div class="row" style="justify-content:space-between;margin-bottom:12px"><h2>Tag ${e.tage.indexOf(tag)+1} · ${fD(tag.datum)}</h2><button class="btn small" data-a="zeigen">🖼️ Fotos zeigen</button></div>

  <div class="times">${team.map((mid,ix)=>zeitBox(e,tag,mid,ix,lk)).join('')}</div>

function dayActions(e,tag){if(!tag||e.status==='abgeschlossen')return'';const i=e.tage.indexOf(tag);const last=i===e.tage.length-1;
  if(!tag.fertig)return `<div class="fab"><button class="btn" data-a="tagende">Neuer Tag</button><button class="btn" data-a="tagsign" data-i="${i}">✍️ Tagesbericht abschließen</button><button class="btn pri" data-a="wizard">Job abschließen</button></div><p class="small muted">„Neuer Tag“ speichert heute ohne Unterschrift, morgen geht es im selben Einsatz weiter. „Tagesbericht abschließen“ lässt den Kunden diesen Tag unterschreiben. „Job abschließen“ führt zu Abbau-Check, Kundenansicht und Lieferschein.</p>`;

  return b.length?`<div class="fab">${b.join('')}</div>`:''}
function tagPage(e,t,i){const s=t.bericht;const team=Object.keys(t.zeiten).map(id=>ma(id)?.name).filter(Boolean);const nf=e.fotos.filter(f=>f.tag===i).length;
  const einst=e.geraete.strahl.map(sid=>{const g=sg(sid);const v=s.einst[sid]||{};return `${esc(g.name)}: ${S.typen[g.typ].felder.map(f=>`${f.label} ${v[f.key]??'–'}`).join(', ')}`}).join('<br>');

  <div class="g"><span>Einsatzort</span><span>${esc(e.einsatzort)}</span><span>Kunde</span><span>${esc(e.kunde)}</span><span>Lieferschein</span><span>${esc(e.ls||'folgt')}</span></div>
  <div style="margin-top:12px"><b>Arbeitsbericht</b><div>${esc(s.text||'–')}</div>${s.bes?`<div>${esc(s.bes)}</div>`:''}</div>

  <div class="ft"><span>Tagesbericht TB${(e.ls||'LS------').slice(2)}-${i+1}</span><span>Seite 1/1</span></div></div>`}
function signDay(e,i){const t=e.tage[i];

  <div id="ds-err" class="small" style="color:var(--danger)" role="alert"></div>

      t.unterschrift=$('#sign').toDataURL('image/png');t.signName=n;t.signTs=Date.now();t.fertig=true;save();closeSheet();render();toast(`Tagesbericht Tag ${i+1} unterschrieben`)}})}
function zeitBox(e,tag,mid,ix,lk){const dis=lk?' disabled':'';const live=!tag.fertig&&!lk;const z=tag.zeiten[mid]||(tag.zeiten[mid]={start:'buero',ende:'buero',p:{},pause:null,pauseOk:false});const L=labels(z);const A=adj(z);const c=calc(z);const he=homeOpen(e,tag);const ph=pauseHint(z,c);
  const rows=[1,2,3,4,5,6].filter(k=>L[k]).map(k=>`<div class="trow"><span class="n">${k}</span><span>${L[k]}</span><button class="tval${z.p[k]?'':' empty'}" data-a="tedit" data-m="${mid}" data-k="${k}" aria-label="${L[k]} ändern"${k>=5&&he?'':dis}>${z.p[k]||'–:–'}${A[k]>=1440?'<span class="small muted" style="font-weight:400"> +1</span>':''}</button>${live||(he&&k>=5)?`<button class="btn small" data-a="tnow" data-m="${mid}" data-k="${k}">Jetzt</button>`:'<span></span>'}</div>`).join('');
  const d=(x,y)=>A[x]!=null&&A[y]!=null?Math.max(0,A[y]-A[x]):0;const parts=[[L[1]?d(1,2):0,'var(--faint)'],[d(2,3),'var(--warn)'],[d(3,4),'var(--ok)'],[d(4,5),'var(--warn)'],[L[6]?d(5,6):0,'var(--faint)']];const all=parts.reduce((s2,x)=>s2+x[0],0)||1;
  return `<section class="box"><div class="row" style="justify-content:space-between"><h3>${esc(ma(mid)?.name)} <span class="small muted" style="font-weight:400">${ix===0?'Vorarbeiter':'Facharbeiter'}</span>${nightOk(z)?' <span class="tag purple">Nachtschicht</span>':''}</h3></div>
  <div class="row small" style="margin:8px 0;gap:12px"><span class="muted">Beginn</span><span class="seg"><button class="${z.start==='buero'?'on':''}" data-a="zmode" data-m="${mid}" data-w="start" data-v="buero"${dis}>Büro</button><button class="${z.start==='hotel'?'on':''}" data-a="zmode" data-m="${mid}" data-w="start" data-v="hotel"${dis}>Hotel</button></span><span class="muted">Ende</span><span class="seg"><button class="${z.ende==='buero'?'on':''}" data-a="zmode" data-m="${mid}" data-w="ende" data-v="buero"${dis}>Büro</button><button class="${z.ende==='hotel'?'on':''}" data-a="zmode" data-m="${mid}" data-w="ende" data-v="hotel"${dis}>Hotel</button></span></div>
  ${rows}
  <div class="trow"><span class="n">⏸</span><span>Pause${pOk(z)?'':' <span class="small muted">Vorschlag</span>'}</span><button class="tval${pOk(z)?'':' empty'}" data-a="pause" data-m="${mid}"${he?'':dis}>${c.pause} min</button>${pOk(z)?'<span></span>':z.p[4]?`<button class="btn small pri" data-a="pok" data-m="${mid}"${he?'':dis}>Bestätigen</button>`:'<span class="small muted" style="text-align:center">nach Abfahrt</span>'}</div>
  ${ph?`<div class="callout warn small" style="margin-top:8px">${ph}</div>`:''}${orderHint(z)?`<div class="callout err small" style="margin-top:8px">${orderHint(z)}</div>`:''}
  <div class="bar" aria-hidden="true">${parts.map(([v,col])=>v>0?`<i style="width:${v/all*100}%;background:${col}"></i>`:'').join('')}</div>
  <div class="sum"><div><span>Rüsten</span><b>${fMin(c.ruest)}</b></div><div><span>Fahrt</span><b>${fMin(c.fahrt)}</b></div><div><span>Vor Ort</span><b>${fMin(c.ort)}</b></div><div><span>Gesamt</span><b>${fMin(c.gesamt)}</b></div></div>
  ${ix>0?`<button class="btn small" style="margin-top:12px" data-a="zcopy" data-m="${mid}"${dis}>Zeiten von ${esc(ma(e.team.vor)?.name)} übernehmen</button>`:''}</section>`}

function tFotos(e){if(!ui.anlage||!e.anlagen.find(a=>a.id===ui.anlage))ui.anlage=e.anlagen[0]?.id||null;
  const tag=offenerTag(e);

  return cam+list+(e.trash.length?`<div class="fab"><span class="small muted">${e.trash.length} gelöschte Fotos im Papierkorb</span><button class="btn small" data-a="restore">Letztes wiederherstellen</button></div>`:'')}

function tBericht(e){const tag=selTag(e);if(!tag)return'<div class="empty">Noch kein Tag begonnen.</div>';
  const b=tag.bericht;const fertig=locked(e,tag);

let sigDirty=false;
function initSign(){const c=$('#sign');if(!c)return;const r=c.getBoundingClientRect();const dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;const g=c.getContext('2d');g.scale(dpr,dpr);g.lineWidth=2.2;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#1a2a6c';sigDirty=false;let down=false;
  c.onpointerdown=ev=>{down=true;c.setPointerCapture(ev.pointerId);g.beginPath();g.moveTo(ev.offsetX,ev.offsetY)};
  c.onpointermove=ev=>{if(!down)return;g.lineTo(ev.offsetX,ev.offsetY);g.stroke();sigDirty=true};
  c.onpointerup=c.onpointercancel=()=>{down=false}}

function hydrateImages(){document.querySelectorAll('img[data-img]').forEach(async im=>{const u=await imgUrl(im.dataset.img);if(u)im.src=u})}

/* ---------- Foto-Import mit Verkleinerung ---------- */
async function shrink(file,max=1600){try{const bm=await createImageBitmap(file);const s=Math.min(1,max/Math.max(bm.width,bm.height));const c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.82))}catch(e){return file}}

/* ---------- Fotos zeigen (Kundenmodus) ---------- */
function showMode(e){const pairs=e.anlagen.map(a=>({a,v:e.fotos.filter(f=>f.anlage===a.id&&f.phase==='vorher'),n:e.fotos.filter(f=>f.anlage===a.id&&f.phase==='nachher')})).filter(p=>p.v.length||p.n.length);
  if(!pairs.length){toast('Noch keine Fotos vorhanden');return}
  let i=0;const L=$('#layer');
  const draw=()=>{const p=pairs[i];L.innerHTML=`<div class="show" role="dialog" aria-label="Fotos zeigen"><div class="head"><div><b style="font-size:18px">${esc(p.a.name)}</b><div style="color:#aaa;font-size:14px">${esc(e.einsatzort)} · ${i+1} von ${pairs.length}</div></div><button class="exit" id="exit">Zum Beenden gedrückt halten</button></div>
    <div class="pair"><figure><figcaption>Vorher</figcaption><div>${p.v[0]?`<img data-img="${p.v[0].id}" alt="vorher">`:'kein Foto'}</div></figure><figure><figcaption>Nachher</figcaption><div>${p.n[0]?`<img data-img="${p.n[0].id}" alt="nachher">`:'in Arbeit'}</div></figure></div>
    <div class="nav"><button id="prev"${i===0?' disabled':''}>‹ Zurück</button><span style="color:#888">${p.v.length} vorher · ${p.n.length} nachher</span><button id="next"${i===pairs.length-1?' disabled':''}>Weiter ›</button></div></div>`;
    hydrateImages();$('#prev').onclick=()=>{if(i>0){i--;draw()}};$('#next').onclick=()=>{if(i<pairs.length-1){i++;draw()}};
    const ex=$('#exit');let tm;ex.onpointerdown=()=>{ex.textContent='Halten…';tm=setTimeout(()=>{L.innerHTML=''},900)};ex.onpointerup=ex.onpointerleave=()=>{clearTimeout(tm);if(L.firstChild)ex.textContent='Zum Beenden gedrückt halten'}};

function formSheet(title,fields,submit,onOk){sheet(`<h2>${esc(title)}</h2><form id="fs" class="stack">${fields}<div id="fs-err" class="small" style="color:var(--danger)" role="alert"></div><div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="fs-c">Abbrechen</button><button class="btn pri">${esc(submit)}</button></div></form>`,el=>{

function newDay(e){const prev=curTag(e);const d={datum:today(),fertig:false,zeiten:{},bericht:{text:'',sm:prev?.bericht.sm||'ultrafein',grund:true,kg:null,einst:JSON.parse(JSON.stringify(prev?.bericht.einst||{})),bes:''}};
  [e.team.vor,e.team.fach].filter(Boolean).forEach(m=>{const pz=prev?.zeiten[m];d.zeiten[m]={start:pz?.ende==='hotel'?'hotel':'buero',ende:'buero',p:{},pause:null,pauseOk:false}});e.tage.push(d)}
async function sha(text){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return [...new Uint8Array(b)].slice(0,8).map(x=>x.toString(16).padStart(2,'0')).join('')}catch(err){return uid()}}
async function finish(e,sig){
  const ids=e.fotos.map(f=>f.id).join(',');sig.hash=await sha(e.ls+ids+e.einsatzort);
  e.zeitenAufLs=sig.zeiten;const ct=offenerTag(e);if(ct)ct.fertig=true;
  e.lsHtml=page3(e,sig);e.status='abgeschlossen';e.ergebnis=sig.ohne?'ausstehend':'unterschrieben';e.abschluss={datum:today(),name:sig.name,ohneKunde:!!sig.ohne};
  const k=kp(e.geraete.kompressor);if(k&&num(e.ende?.kompH)!=null){k.h=+e.ende.kompH;if(!k.eigen)k.aktiv=false}
  const f=fz(e.geraete.fahrzeug);if(f&&num(e.ende?.km)!=null)f.km=+e.ende.km;
  if(f&&e.check?.saecke!=null){const sm=curTag(e)?.bericht.sm||'ultrafein';f.saecke=f.saecke||{};f.saecke[sm]=e.check.saecke}
  Object.entries(e.check||{}).forEach(([k2,v])=>{if(v?.s==='fehlt'){const name=k2.startsWith('c')?S.checkliste[+k2.slice(1)]:e.zusatz.find(z=>'z'+z.id===k2)?.name;S.maengel.push({id:uid(),teil:name,art:'fehlt',notiz:v.n||'beim Abbau gemeldet',ts:Date.now(),von:S.user,status:'offen'})}});
  const datei=`${yymmdd(today())} ${e.kunde===e.einsatzort?e.einsatzort:e.kunde+' '+e.einsatzort} Lieferschein unterschr ${e.ls||''}.pdf`;
  save();V={name:'einsatz',id:e.id};ui.tab='heute';render();
  sheet(`<h2>${sig.ohne?'Abgeschlossen ohne Unterschrift':'Lieferschein unterschrieben'}</h2><div class="stack small">
   <div class="callout ok">Gespeichert. Im Echtbetrieb entsteht jetzt:</div>
   <div>📄 <b>${esc(datei)}</b></div><div>🖼️ ${esc(datei.replace('Lieferschein unterschr '+(e.ls||''),'Fotodoku FD'+(e.ls||'').slice(2)))}</div>
   <div>${sig.ohne?'Steht unter „Abgeschlossen“ als „Unterschrift ausstehend“.':sig.versand?(sig.spaeter?'Versand an den Einsatzort wartet im Büro.':'Wird an '+esc(sig.mail)+' gesendet, Kopie an post@.'):'Kein Versand an den Einsatzort, Kopie an post@.'}</div>
   <div>Fotobericht an ${esc(e.kunde)} wartet auf Freigabe im Büro.</div></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn pri" id="ok">Fertig</button></div>`,el=>{el.querySelector('#ok').onclick=closeSheet})}

const ARTEN={anreise:'Anreise',abreise:'Abreise',wechsel:'Zwischen zwei Jobs'};
function reiseList(e){const rs=S.reisetage.filter(r=>r.einsatz===e.id).sort((a,b)=>a.datum.localeCompare(b.datum));if(!rs.length)return'';
  return `<div class="box" style="margin-bottom:16px"><h3 style="margin-bottom:6px">🚐 Reisetage</h3>${rs.map(r=>{const d=toMin(r.an)-toMin(r.ab);return `<div class="check"><div><b>${fD(r.datum)} · ${ARTEN[r.art]}</b><div class="small muted">${r.ab}–${r.an} Uhr · ${fMin(d)} h Fahrt · ${r.ma.map(id=>esc(ma(id)?.name)).join(', ')}${r.notiz?' · '+esc(r.notiz):''}</div></div><button class="btn small" data-a="reiseedit" data-id="${r.id}">Ändern</button></div>`}).join('')}</div>`}
function reiseSheet(r){const jobs=S.einsaetze.filter(e=>e.status!=='abgeschlossen'||(e.abschluss&&e.abschluss.datum>=addDays(today(),-14))).sort((a,b)=>a.von.localeCompare(b.von));
  sheet(`<h2>${r.id?'Reisetag ändern':'Reisetag erfassen'}</h2><div class="stack">
  <div class="field"><label>Zu welchem Job? <span style="color:var(--danger)">*</span></label><div class="stack" style="gap:6px">${jobs.map(e=>`<button type="button" class="pick${r.einsatz===e.id?' on':''}" data-rj="${e.id}" style="text-align:left;height:auto;padding:8px 12px"><b>${esc(e.einsatzort)}</b> <span class="small">${e.von===e.bis?fD(e.von):fD(e.von)+' – '+fD(e.bis)} · ${e.status==='vorbereitet'?'vorbereitet':e.status==='inarbeit'?'in Arbeit':'abgeschlossen'}</span></button>`).join('')}</div></div>
  <div class="field"><label>Art</label><div class="pickrow">${Object.entries(ARTEN).map(([k,l])=>`<button type="button" class="pick${r.art===k?' on':''}" data-ra="${k}">${l}</button>`).join('')}</div></div>
  <div class="field"><label for="rt-d">Datum</label><input class="inp" id="rt-d" type="date" value="${r.datum}"></div>
  <div class="field"><label>Wer reist?</label><div class="pickrow">${S.mitarbeiter.map(m=>`<button type="button" class="pick${r.ma.includes(m.id)?' on':''}" data-rm="${m.id}">${esc(m.name)}</button>`).join('')}</div></div>
  <div class="times" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="field"><label>Abfahrt</label><button type="button" class="tval inp${r.ab?'':' empty'}" data-rt="ab">${r.ab||'wählen'}</button></div><div class="field"><label>Ankunft</label><button type="button" class="tval inp${r.an?'':' empty'}" data-rt="an">${r.an||'wählen'}</button></div></div>
  <div class="field"><label for="rt-n">Notiz (optional)</label><input class="inp" id="rt-n" value="${esc(r.notiz)}" placeholder="z. B. Hotel in Hamburg, Stau A7"></div>
  <div id="rt-err" class="small" style="color:var(--danger)" role="alert"></div>
  <div class="row">${r.id?'<button class="btn danger" id="rt-del">Löschen</button>':''}<span style="flex:1"></span><button class="btn" id="rt-c">Abbrechen</button><button class="btn pri" id="rt-ok">Speichern</button></div></div>`,el=>{
    const keep=()=>{r.datum=el.querySelector('#rt-d').value;r.notiz=el.querySelector('#rt-n').value};
    const sugg=()=>{if(r.dTouched||!r.einsatz)return;const e=E(r.einsatz);if(r.art==='anreise')r.datum=addDays(e.von,-1);else if(r.art==='abreise')r.datum=addDays(e.bis,1)};
    el.querySelector('#rt-d').onchange=()=>{r.dTouched=true};
    el.querySelectorAll('[data-rj]').forEach(b=>b.onclick=()=>{keep();r.einsatz=b.dataset.rj;sugg();reiseSheet(r)});
    el.querySelectorAll('[data-ra]').forEach(b=>b.onclick=()=>{keep();r.art=b.dataset.ra;sugg();reiseSheet(r)});
    el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{keep();const id=b.dataset.rm;r.ma=r.ma.includes(id)?r.ma.filter(x=>x!==id):[...r.ma,id];reiseSheet(r)});
    el.querySelectorAll('[data-rt]').forEach(b=>b.onclick=async()=>{keep();const k=b.dataset.rt;const t=await pickTime(k==='ab'?'Abfahrt':'Ankunft',r[k]||(k==='an'&&r.ab?r.ab:null));if(t)r[k]=t;reiseSheet(r)});
    el.querySelector('#rt-c').onclick=closeSheet;
    const del=el.querySelector('#rt-del');if(del)del.onclick=()=>{if(del.dataset.sure){S.reisetage=S.reisetage.filter(x=>x.id!==r.id);save();closeSheet();render();toast('Reisetag gelöscht')}else{del.dataset.sure=1;del.textContent='Wirklich löschen?'}};
    el.querySelector('#rt-ok').onclick=()=>{keep();const err=m=>{el.querySelector('#rt-err').textContent=m};
      if(!r.einsatz)return err('Bitte den Job auswählen, zu dem der Reisetag gehört.');
      if(!r.datum)return err('Bitte ein Datum wählen.');
      if(!r.ma.length)return err('Bitte mindestens einen Mitarbeiter wählen.');
      if(!r.ab||!r.an)return err('Bitte Abfahrt und Ankunft wählen.');
      if(toMin(r.an)<=toMin(r.ab))return err('Die Ankunft muss nach der Abfahrt liegen.');
      const e=E(r.einsatz);const clash=e.tage.find(t=>t.datum===r.datum&&r.ma.some(id=>t.zeiten[id]));
      if(clash&&!r.ok2){r.ok2=true;return err(`Am ${fDY(r.datum)} gibt es bei diesem Job schon einen Arbeitstag. Für An- oder Abreise am selben Tag dort „Hotel“ als Beginn oder Ende wählen. Nochmal „Speichern“, wenn der Reisetag trotzdem richtig ist.`)}
      delete r.ok2;delete r.dTouched;if(r.id){const i=S.reisetage.findIndex(x=>x.id===r.id);S.reisetage[i]=r}else{r.id=uid();r.von=S.user;S.reisetage.push(r)}
      save();closeSheet();render();toast(`Reisetag gespeichert: ${E(r.einsatz).einsatzort}`)};
  })}

  case 'strahl':{const s=e.geraete.strahl;const id=b.dataset.id;if(s.includes(id)){if(s.length>1)s.splice(s.indexOf(id),1)}else if(s.length<2)s.push(id);else toast('Höchstens zwei Strahlgeräte');save();render();break}

  case 'tedit':{const z=selTag(e).zeiten[b.dataset.m];if(await setTime(z,b.dataset.k)){save();render()}break}
  case 'pause':{const z=selTag(e).zeiten[b.dataset.m];const P=[0,15,30,45,60,75,90,105,120];let cur=calc(z).pause;
    for(;;){const r=await wheelPick({title:'Pause',cols:[{labels:P.map(p=>p+' min'),index:Math.max(0,P.indexOf(cur))}]});if(!r)break;const v=P[r[0]];const c=calc(z);
      if(c.est!=null&&v<c.min){const go=await new Promise(res=>sheet(`<h2>Pause zu kurz</h2><p>Bei ${fMin(c.est)} h Anwesenheit schreibt das Arbeitszeitgesetz mindestens <b>${c.min} Minuten</b> Pause vor. Die Pause sollte länger sein.</p><div class="row" style="justify-content:flex-end"><button class="btn" id="pz-a">Pause ändern</button><button class="btn pri" id="pz-d">Dennoch eintragen</button></div>`,el=>{el.querySelector('#pz-a').onclick=()=>{closeSheet();res(false)};el.querySelector('#pz-d').onclick=()=>{closeSheet();res(true)}}));

  case 'zmode':{const z=selTag(e).zeiten[b.dataset.m];z[b.dataset.w]=b.dataset.v;if(b.dataset.w==='start'&&b.dataset.v==='hotel')delete z.p[1];if(b.dataset.w==='ende'&&b.dataset.v==='hotel')delete z.p[6];save();render();break}

  case 'anladd':textSheet('Anlage hinzufügen','Name der Anlage','',v=>{const a={id:uid(),name:v};e.anlagen.push(a);ui.anlage=a.id;save();render()});break;
  case 'anlren':{const an=e.anlagen.find(x=>x.id===b.dataset.id);textSheet('Anlage umbenennen','Name der Anlage',an.name,v=>{an.name=v;save();render()});break}
  case 'anlup':{const i=e.anlagen.findIndex(x=>x.id===b.dataset.id);if(i>0){[e.anlagen[i-1],e.anlagen[i]]=[e.anlagen[i],e.anlagen[i-1]];save();render()}break}
  case 'anldel':{const an=e.anlagen.find(x=>x.id===b.dataset.id);const n=e.fotos.filter(f=>f.anlage===an.id).length;const rest=e.anlagen.filter(x=>x.id!==an.id);
    if(!n){confirmSheet('Anlage löschen',`„${esc(an.name)}“ hat keine Fotos und wird gelöscht.`,'Löschen',()=>{e.anlagen=rest;save();render()});break}
    if(!rest.length){toast('Letzte Anlage mit Fotos kann nicht gelöscht werden');break}
    formSheet('Anlage löschen',`<p>„${esc(an.name)}“ hat ${n} Fotos. Wohin sollen sie verschoben werden?</p>${pickField('z','Ziel-Anlage',rest.map(r=>[r.id,r.name]),rest[0].id)}`,'Verschieben und löschen',d=>{e.fotos.forEach(f=>{if(f.anlage===an.id)f.anlage=d.z});e.anlagen=rest;save();render()});break}
  case 'foto':{const f=e.fotos.find(x=>x.id===b.dataset.id);if(!f)break;const an=e.anlagen.find(x=>x.id===f.anlage);const u=await imgUrl(f.id);
    sheet(`<h2>${esc(an?.name)} · ${f.phase}</h2>${u?`<img src="${u}" alt="" style="border-radius:6px;width:100%">`:''}<div class="stack" style="margin-top:12px">${e.status!=='abgeschlossen'?`${pickField('mv','Umhängen zu Anlage',e.anlagen.map(x=>[x.id,x.name]),f.anlage)}<div class="row"><button class="btn" id="ph">${f.phase==='vorher'?'Als Nachher markieren':'Als Vorher markieren'}</button><button class="btn danger" id="del">Foto löschen</button><button class="btn pri" id="cl" style="margin-left:auto">Fertig</button></div>`:'<div class="row" style="justify-content:flex-end"><button class="btn pri" id="cl">Schließen</button></div>'}</div>`,el=>{
      el.querySelector('#cl').onclick=()=>{closeSheet();render()};
      el.querySelectorAll('[data-pk=mv]').forEach(x=>x.onclick=()=>{f.anlage=x.dataset.v;el.querySelectorAll('[data-pk=mv]').forEach(y=>y.classList.toggle('on',y===x));save()});
      const ph=el.querySelector('#ph');if(ph)ph.onclick=()=>{f.phase=f.phase==='vorher'?'nachher':'vorher';save();closeSheet();render();toast('Geändert')};
      const del=el.querySelector('#del');if(del)del.onclick=()=>{if(del.dataset.sure){e.fotos=e.fotos.filter(x=>x!==f);e.trash.push(f);save();closeSheet();render();toast('Foto im Papierkorb')}else{del.dataset.sure=1;del.textContent='Wirklich löschen?'}}});break}
  case 'restore':{const f=e.trash.pop();if(f){e.fotos.push(f);save();render();toast('Foto wiederhergestellt')}break}
  case 'sm':selTag(e).bericht.sm=b.dataset.v;save();render();break;
  case 'grund':selTag(e).bericht.grund=b.dataset.v==='1';save();render();break;
  case 'einst':{const t=selTag(e);t.bericht.einst[b.dataset.s]=t.bericht.einst[b.dataset.s]||{};t.bericht.einst[b.dataset.s][b.dataset.k]=b.dataset.v;save();render();break}
  case 'tagsign':{const i=+b.dataset.i;const t=e.tage[i];const m=missingDay(e,t,!t.fertig);if(m.length){gateSheet(e,m,`Tag ${i+1} ist noch nicht vollständig`);break}signDay(e,i);break}
  case 'tagende':{const t=offenerTag(e);const go=()=>{t.fertig=true;save();render();toast('Tag gespeichert. Morgen geht es hier weiter.')};
    if(e.tagesUnterschrift){sheet(`<h2>Tagesbericht unterschreiben</h2><p class="small muted">${esc(t.bericht.text||'–')}</p><canvas class="sign" id="sign"></canvas><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="sk">Ohne Unterschrift</button><button class="btn pri" id="so">Unterschrieben</button></div>`,el=>{initSign();el.querySelector('#sk').onclick=()=>{closeSheet();go()};el.querySelector('#so').onclick=()=>{t.unterschrift=$('#sign').toDataURL('image/png');closeSheet();go()}})}else go();break}
  case 'wizard':{const m=missingJob(e);if(m.length){gateSheet(e,m,'Job noch nicht vollständig');break}}ui.wiz=0;V={name:'abschluss',id:e.id};render();scrollTo(0,0);break;
  case 'wnext':ui.wiz=Math.min(4,ui.wiz+1);if(ui.wiz===3)V.kv='ls';render();scrollTo(0,0);break;
  case 'wback':ui.wiz=Math.max(0,ui.wiz-1);render();scrollTo(0,0);break;
  case 'chk':e.check=e.check||{};e.check[b.dataset.k]={s:b.dataset.v,n:e.check[b.dataset.k]?.n||''};save();render();break;
  case 'saecke':{const r=await wheelPick({title:'Säcke Strahlmittel übrig (25 kg)',cols:[{labels:Array.from({length:41},(_,i)=>String(i)),index:e.check?.saecke??fz(e.geraete.fahrzeug)?.saecke?.[curTag(e)?.bericht.sm||'ultrafein']??0}]});if(r){e.check.saecke=r[0];save();render()}break}
  case 'kv':V.kv=b.dataset.v;render();break;
  case 'ohne':confirmSheet('Ohne Kunde abschließen','Der Lieferschein wird fertig erzeugt und als „Unterschrift ausstehend“ markiert. Das Büro schickt ihn zur Unterschrift.','Abschließen',()=>finish(e,{ohne:true,eingesehen:false,zeiten:e.zeitenAufLs}));break;
  case 'sg':e.sig[b.dataset.k]=b.dataset.v==='1';save();render();break;
  case 'sigclear':initSign();break;
  case 'fertig':{const s=e.sig;if(!s.name.trim()){$('#sg-err').textContent='Bitte den Namen des Unterzeichners eintragen.';return}if(!sigDirty){$('#sg-err').textContent='Bitte im Feld unterschreiben lassen.';return}if(s.versand&&!/\S+@\S+\.\S+/.test(s.mail)){$('#sg-err').textContent='Die E-Mail-Adresse sieht unvollständig aus.';return}
    s.img=$('#sign').toDataURL('image/png');finish(e,{...s});break}
  case 'mangel':mangelSheet();break;
  case 'reise':reiseSheet({id:null,datum:today(),art:'anreise',einsatz:V.name==='einsatz'?V.id:null,ma:[S.user],ab:null,an:null,notiz:''});break;
  case 'reiseedit':{const r=S.reisetage.find(x=>x.id===b.dataset.id);if(r)reiseSheet(JSON.parse(JSON.stringify(r)));break}
  case 'tanken':tankSheet();break;
  case 'beladen':{const f=fz(e.geraete.fahrzeug);const keys=Object.keys(S.strahlmittel).slice(0,2);const r=await wheelPick({title:'Säcke geladen',cols:[{labels:keys.map(k=>S.strahlmittel[k]),index:0},{labels:Array.from({length:21},(_,i)=>'+'+i),index:4}]});if(r){f.saecke=f.saecke||{};f.saecke[keys[r[0]]]=(f.saecke[keys[r[0]]]||0)+r[1];save();render();toast('Bestand aktualisiert')}break}
  case 'mache':{const i=S.intern.find(x=>x.id===V.id);i.zust=S.user;save();render();break}
  case 'erledigt':{const i=S.intern.find(x=>x.id===V.id);i.status='erledigt';save();V={name:'start'};render();toast('Auftrag erledigt');break}
  case 'm2a':{const m=S.maengel.find(x=>x.id===b.dataset.id);S.intern.push({id:uid(),titel:`${m.teil}: ${m.art}`,beschreibung:m.notiz||'Aus Mängelmeldung.',datum:today(),zust:'m1',status:'offen'});m.status='auftrag';save();render();toast('Interner Auftrag für Matthias angelegt');break}
  }});
document.addEventListener('input',ev=>{const t=ev.target;const e=V.id?E(V.id):null;
  if(t.dataset.b&&e){const tag=selTag(e);if(tag&&!locked(e,tag)){tag.bericht[t.dataset.b]=t.dataset.b==='kg'?num(t.value):t.value;save()}}
  if(t.dataset.s&&e){e.ende=e.ende||{};e.ende[t.dataset.s]=t.value===''?'':t.value;save();const btn=document.querySelector('[data-a=wnext]');if(btn&&t.dataset.s==='kompH')btn.disabled=t.value===''}
  if(t.dataset.sg&&e){e.sig[t.dataset.sg]=t.value;save()}
  if(t.dataset.cn&&e){e.check[t.dataset.cn].n=t.value;save()}
  if(t.dataset.in){const i=S.intern.find(x=>x.id===V.id);if(i){i.notiz=t.value;save()}}});
document.addEventListener('change',async ev=>{const t=ev.target;const e=V.id?E(V.id):null;
  if(t.dataset.f&&e){e.team[t.dataset.f]=t.value||null;const ct=offenerTag(e);if(ct&&t.value&&!ct.zeiten[t.value])ct.zeiten[t.value]={start:'buero',ende:'buero',p:{},pause:null,pauseOk:false};save();render()}
  if(t.id==='cam-in'&&e&&t.files.length){const files=[...t.files];toast(files.length>1?`${files.length} Fotos werden gespeichert…`:'Foto wird gespeichert…');const tg=Math.max(0,e.tage.length-1);
    let last=null;for(const f of files){const blob=await shrink(f);const id=uid();await putBlob(id,blob);last={id,anlage:ui.anlage,phase:ui.phase,tag:tg,ts:Date.now()};e.fotos.push(last)}save();render();if(last)postShot(e,last,files.length)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('#layer').innerHTML)closeSheet();if(ev.key==='Enter'&&ev.target.id==='lg-pin')document.querySelector('[data-a=login]').click()});

/* ---------- Start ---------- */
if(S.user)V={name:'start'};
render();
openDB().then(()=>{render();ensureSeedPhotos()});
})();
</script>
